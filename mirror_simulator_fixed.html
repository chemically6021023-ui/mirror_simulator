<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>평면거울 시뮬레이터 - 빛과 파동</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none}
body{font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;background:#f5f5f0;user-select:none;overflow:hidden;height:100vh;height:100dvh;display:flex;flex-direction:column}
#app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column}
#header{background:#fff;border-bottom:1.5px solid #e0ddd5;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
#header h1{font-size:14px;font-weight:700;color:#2c2c2a;white-space:nowrap;letter-spacing:-0.3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:5px 11px;border-radius:20px;border:1.5px solid #d3d1c7;background:#fff;font-size:11px;font-weight:600;color:#5f5e5a;cursor:pointer;transition:all .2s;white-space:nowrap;font-family:inherit}
.tab.active{background:#3b5bdb;border-color:#3b5bdb;color:#fff;box-shadow:0 2px 8px rgba(59,91,219,0.3)}
.tab:hover:not(.active){background:#f0eef8;border-color:#a5a0e8}
#info-bar{background:linear-gradient(90deg,#eef2ff,#f0f9ff);border-bottom:1px solid #c5cefa;padding:6px 14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;font-weight:600;color:#3b4fc0;flex-shrink:0}
.info-item{display:flex;align-items:center;gap:5px}
.info-val{background:#3b5bdb;color:#fff;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700;min-width:28px;text-align:center}
#angle-info{display:none}
#controls{background:#fff;border-bottom:1px solid #e0ddd5;padding:7px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:#5f5e5a;flex-shrink:0;min-height:40px}
.ctrl-label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:5px 10px;border-radius:8px;border:1px solid #d3d1c7;background:#fff;font-size:12px;font-family:inherit;transition:background .15s}
.ctrl-label:hover{background:#f5f4ff}
.ctrl-label input[type=checkbox]{cursor:pointer;accent-color:#3b5bdb;width:14px;height:14px}


#canvas-wrap{position:relative;flex:1;overflow:hidden}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#legend{background:#fff;border-top:1px solid #e0ddd5;padding:6px 14px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#888780;flex-shrink:0}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-line{width:24px;height:3px;border-radius:2px}
#status-msg{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);border-radius:20px;padding:9px 22px;font-size:13px;font-weight:700;z-index:20;white-space:pre-wrap;text-align:center;max-width:90%;display:none;box-shadow:0 4px 18px rgba(0,0,0,0.2);pointer-events:none;font-family:inherit;line-height:1.5}
#status-msg.show-err {background:#c0392b;color:#fff;display:block}
#status-msg.show-ok  {background:#2a9d4f;color:#fff;display:block}
#status-msg.show-hint{background:rgba(59,91,219,0.92);color:#fff;display:block}
#hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(59,91,219,0.12);border:1px solid rgba(59,91,219,0.25);color:#3b4fc0;border-radius:20px;padding:5px 14px;font-size:11px;font-weight:600;pointer-events:none;white-space:nowrap}
@media(max-width:520px){
  #header h1{font-size:12px}
  .tab{font-size:10px;padding:4px 7px}
  .info-val{font-size:11px}
  #info-bar{gap:8px;font-size:11px}
  #legend{gap:8px;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>🪞 평면거울 시뮬레이터</h1>
    <div class="tabs">
      <button class="tab active" onclick="setMode(0)">탐구 1: 상의 특징</button>
      <button class="tab" onclick="setMode(1)">탐구 2: 빛의 경로</button>
    </div>
  </div>
  <div id="info-bar">
    <div class="info-item">📏 거울→물체: <span class="info-val" id="obj-dist">0</span>칸</div>
    <div class="info-item" id="img-dist-item">🖼 거울→상: <span class="info-val" id="img-dist">0</span>칸</div>
    <div class="info-item" id="angle-info">📐 입사각=반사각: <span class="info-val" id="angle-val">0°</span></div>
  </div>
  <div id="controls">
    <!-- 탐구 1 -->
    <span id="mode0-ctrl" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="color:#5f5e5a;font-weight:600">🕯️ 물체를 드래그해서 움직여 보세요!</span>
      <label class="ctrl-label"><input type="checkbox" id="show-image" onchange="draw()"> 거울 속 상 보기</label>
    </span>
    <!-- 탐구 2 -->
    <span id="mode1-ctrl" style="display:none;gap:8px;flex-wrap:wrap;align-items:center">
      <label class="ctrl-label"><input type="checkbox" id="show-rays" checked onchange="draw()"> 빛의 경로 보기</label>
      <label class="ctrl-label"><input type="checkbox" id="show-normal" onchange="draw()"> 법선 보기</label>
      <label class="ctrl-label"><input type="checkbox" id="show-image2" onchange="draw()"> 거울 속 상 보기</label>
      <span style="color:#888780">👁 눈도 드래그 가능해요</span>
    </span>
    <!-- 도전 3: 퀴즈 -->
  </div>
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="hint">← 거울 왼쪽에서 조작하세요</div>
    <div id="status-msg"></div>
  </div>
  <div id="legend">
    <div class="leg-item"><div class="leg-line" style="background:#e63946"></div>입사광선</div>
    <div class="leg-item"><div class="leg-line" style="background:#2a9d8f"></div>반사광선</div>
    <div class="leg-item"><div class="leg-line" style="background:#e9c46a;border:1px dashed #c9a434"></div>가상의 연장선</div>
    <div class="leg-item"><div class="leg-line" style="background:#3b5bdb"></div>평면거울</div>
    <div class="leg-item"><div class="leg-line" style="background:rgba(136,135,128,0.8)"></div>법선</div>
  </div>
</div>

<script>
// ── roundRect 폴리필 (구형 안드로이드 WebView 대응) ─────────────────
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(typeof r === 'undefined') r = 0;
    if(typeof r === 'object') r = r[0] || 0;
    r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
    this.beginPath();
    this.moveTo(x+r, y);
    this.lineTo(x+w-r, y);
    this.quadraticCurveTo(x+w, y, x+w, y+r);
    this.lineTo(x+w, y+h-r);
    this.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
    this.lineTo(x+r, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-r);
    this.lineTo(x, y+r);
    this.quadraticCurveTo(x, y, x+r, y);
    this.closePath();
  };
}
</script>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const wrap   = document.getElementById('canvas-wrap');

const GRID = 50;
const HALF = GRID / 2;

let mode = 0, W, H, mx;

// ── 탐구 1·2 드래그 오브젝트 ─────────────────────────────────────
let obj = {x:0,y:0};
let eye = {x:0,y:0};



// ── 거울 범위 정의 ────────────────────────────────────────────────
// 탐구 1: 긴 거울 (12%~88%)
function m1Top(){ return Math.round(H*0.12); }
function m1Bot(){ return Math.round(H*0.88); }
// 탐구 2: 탐구 1과 동일한 긴 거울
function m2Top(){ return Math.round(H*0.12); }
function m2Bot(){ return Math.round(H*0.88); }
// 탐구 3 퀴즈 거울 (28%~72%) — 삭제됨
// ─── 초기화 ──────────────────────────────────────────────────────
function resize(){
  W = wrap.clientWidth || window.innerWidth || 800;
  H = wrap.clientHeight;
  if(!H || H < 100){
    // dvh 미지원 환경 폴백: 전체 높이에서 고정 UI 높이를 빼서 추정
    var totalH = window.innerHeight || document.documentElement.clientHeight || 600;
    H = Math.max(totalH - 160, 300);
  }
  canvas.width  = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width  = W+'px';
  canvas.style.height = H+'px';
  ctx.scale(devicePixelRatio, devicePixelRatio);

  mx = Math.round(W/2/GRID)*GRID;
  const cy = Math.round(H/2/GRID)*GRID;

  // 탐구 1·2 초기 배치 (탐구 2 짧은 거울 기준 거울 범위 안쪽에 배치)
  obj = {x: mx - GRID*4, y: cy};
  eye = {x: mx - GRID*2, y: Math.round(H*0.46/GRID)*GRID};

  // 탐구 3: 기획 고정 배치
  draw();
}

// ─── 공통 그리기 유틸 ─────────────────────────────────────────────

function drawGrid(){
  ctx.save();
  ctx.strokeStyle='rgba(180,178,169,0.28)'; ctx.lineWidth=0.7;
  for(let x=0;x<W;x+=GRID){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=GRID){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.strokeStyle='rgba(180,178,169,0.60)'; ctx.lineWidth=1.1;
  for(let x=0;x<W;x+=GRID*5){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=GRID*5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
}

// 거울 + 거울 뒤 배경 (mirX = 거울 x 위치, 기본값 mx)
function drawMirrorWall(top, bot, mirX){
  mirX = mirX || mx;
  ctx.save();
  ctx.fillStyle='rgba(100,120,200,0.08)';
  ctx.fillRect(mirX,0,W-mirX,H);
  ctx.fillStyle='rgba(80,100,180,0.07)';
  ctx.fillRect(mirX,top,18,bot-top);
  // 글로우
  ctx.strokeStyle='rgba(59,91,219,0.14)'; ctx.lineWidth=18; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(mirX,top); ctx.lineTo(mirX,bot); ctx.stroke();
  // 거울 바
  ctx.strokeStyle='#3b5bdb'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(mirX,top); ctx.lineTo(mirX,bot); ctx.stroke();
  // 빗금
  ctx.strokeStyle='rgba(59,91,219,0.35)'; ctx.lineWidth=1.6;
  for(let y=top+10;y<bot;y+=18){
    ctx.beginPath(); ctx.moveTo(mirX,y); ctx.lineTo(mirX+9,y+9); ctx.stroke();
  }
  // 끝점
  ctx.fillStyle='#3b5bdb';
  ctx.beginPath(); ctx.arc(mirX,top,6,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(mirX,bot,6,0,Math.PI*2); ctx.fill();
  // 거울 뒤 라벨
  ctx.font='bold 11px "Segoe UI",sans-serif';
  ctx.fillStyle='rgba(59,91,219,0.28)'; ctx.textAlign='center';
  ctx.save(); ctx.translate(mirX+28,H/2); ctx.rotate(Math.PI/2);
  ctx.fillText('거울 뒤 — 빛 통과 불가',0,0);
  ctx.restore();
  ctx.restore();
}

function arrowHead(x,y,angle,color,size){
  size=size||11;
  ctx.save(); ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x-size*Math.cos(angle-0.42),y-size*Math.sin(angle-0.42));
  ctx.lineTo(x-size*Math.cos(angle+0.42),y-size*Math.sin(angle+0.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function drawRay(x1,y1,x2,y2,color,dashed,w,midArrow){
  w=w||2.2;
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(dashed) ctx.setLineDash([8,6]); else ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]);
  const a=Math.atan2(y2-y1,x2-x1);
  arrowHead(x2,y2,a,color,11);
  if(midArrow) arrowHead((x1+x2)/2,(y1+y2)/2,a,color,9);
  ctx.restore();
}

function reflectX(p){ return {x:2*mx-p.x, y:p.y}; }

function drawCandle(x,y,flipped,alpha){
  alpha=(alpha===undefined)?1:alpha;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle='#ffd166';
  ctx.beginPath(); ctx.roundRect(x-7,y,14,30,3); ctx.fill();
  ctx.fillStyle='#f4b942';
  ctx.beginPath(); ctx.ellipse(x-3,y+2,4,2,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#5a3e1b'; ctx.lineWidth=1.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-7); ctx.stroke();
  ctx.fillStyle='#ff6b35';
  ctx.beginPath();
  ctx.moveTo(x,y-23); ctx.bezierCurveTo(x+8,y-16,x+8,y-5,x,y-4);
  ctx.bezierCurveTo(x-8,y-5,x-8,y-16,x,y-23); ctx.fill();
  ctx.fillStyle='#fff3b0';
  ctx.beginPath();
  ctx.moveTo(x,y-18); ctx.bezierCurveTo(x+3,y-12,x+3,y-7,x,y-6);
  ctx.bezierCurveTo(x-3,y-7,x-3,y-12,x,y-18); ctx.fill();
  const dotX=flipped?x-9:x+9;
  ctx.fillStyle='#ef476f';
  ctx.beginPath(); ctx.arc(dotX,y+8,5,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(dotX,y+8,5,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

// 보물 상자

function drawEye(x,y,label){
  ctx.save();
  ctx.fillStyle='rgba(59,91,219,0.10)';
  ctx.beginPath(); ctx.ellipse(x,y,24,18,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.strokeStyle='#5f5e5a'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(x,y,16,10,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#3b5bdb';
  ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1a2e';
  ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x+2,y-2,2,0,Math.PI*2); ctx.fill();
  if(label){
    ctx.font='bold 11px "Segoe UI",sans-serif';
    ctx.textAlign='center'; ctx.fillStyle='#2c2c2a';
    ctx.fillText(label,x,y+26);
  }
  ctx.restore();
}

function drawBgLabel(x,y,text,color,bg){
  ctx.save();
  ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='center';
  const tw=ctx.measureText(text).width;
  if(bg){
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.roundRect(x-tw/2-6,y-14,tw+12,18,8); ctx.fill();
  }
  ctx.fillStyle=color||'#2c2c2a';
  ctx.fillText(text,x,y);
  ctx.restore();
}

function setMsg(cls,text){
  const el=document.getElementById('status-msg');
  if(!cls){el.className='';el.style.display='none';return;}
  el.className=cls; el.textContent=text;
}

function resetInfoBar(){
  document.getElementById('obj-dist').textContent='—';
  document.getElementById('img-dist').textContent='—';
  document.getElementById('angle-info').style.display='none';
  document.getElementById('img-dist-item').style.opacity='1';
}

// ─── 탐구 1: 상의 특징 ───────────────────────────────────────────
function drawMode0(){
  const img=reflectX(obj);
  drawGrid();
  drawMirrorWall(m1Top(),m1Bot());

  const dObj=Math.round(Math.abs(mx-obj.x)/GRID);
  const dImg=Math.round(Math.abs(mx-img.x)/GRID);
  const showImg=document.getElementById('show-image').checked;

  document.getElementById('obj-dist').textContent=dObj;
  document.getElementById('img-dist').textContent=showImg?dImg:'?';
  document.getElementById('img-dist-item').style.opacity=showImg?'1':'0.35';
  document.getElementById('angle-info').style.display='none';

  // 대칭 점선
  ctx.save();
  ctx.strokeStyle='rgba(59,91,219,0.18)'; ctx.lineWidth=1; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(obj.x,obj.y); ctx.lineTo(img.x,img.y); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();

  // 거리 라벨
  ctx.save();
  ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='#3b5bdb';
  ctx.fillText(dObj+'칸', mx-(mx-obj.x)/2, obj.y-14);
  if(showImg){
    ctx.fillStyle='rgba(59,91,219,0.52)';
    ctx.fillText(dImg+'칸', mx+(img.x-mx)/2, img.y-14);
  }
  ctx.restore();

  if(showImg){
    ctx.save(); ctx.globalAlpha=0.4; drawCandle(img.x,img.y,true); ctx.restore();
    drawBgLabel(img.x,img.y-46,'거울 속 상','rgba(59,91,219,0.6)');
    ctx.save(); ctx.font='10px "Segoe UI",sans-serif';
    ctx.fillStyle='#ef476f'; ctx.textAlign='center';
    ctx.fillText('← 좌우 반전!',img.x-2,img.y+34);
    ctx.restore();
  }
  drawCandle(obj.x,obj.y,false);
  drawBgLabel(obj.x,obj.y-46,'물체','#2c2c2a','rgba(255,255,255,0.85)');
}

// ─── 탐구 2: 빛의 경로 ───────────────────────────────────────────
// 반사점 raw 계산: 눈의 거울 속 상 → srcY 에서 x=mx 교점
function reflectYRaw(srcY, ex, ey){
  const eyeImgX = 2*mx - ex;
  const imgX    = 2*mx - obj.x;
  const imgY    = srcY;
  const denom   = imgX - ex;
  if(Math.abs(denom)<0.001) return null;
  const t = (mx-ex)/denom;
  if(t<=0||t>=1) return null;
  return ey + t*(imgY-ey);
}

function drawMode1(){
  const img=reflectX(obj);
  // ★ 탐구 2 전용 짧은 거울 범위
  const top=m2Top(), bot=m2Bot();
  drawGrid();
  drawMirrorWall(top,bot);

  const showRays  =document.getElementById('show-rays').checked;
  const showNormal=document.getElementById('show-normal').checked;
  const showImg2  =document.getElementById('show-image2').checked;

  document.getElementById('obj-dist').textContent=Math.round(Math.abs(mx-obj.x)/GRID);
  document.getElementById('img-dist').textContent=showImg2?Math.round(Math.abs(mx-img.x)/GRID):'?';
  document.getElementById('img-dist-item').style.opacity=showImg2?'1':'0.35';
  document.getElementById('angle-info').style.display='none';

  if(!showRays){ setMsg(null); }

  if(showRays){
    // 쌍광선: obj.y ± HALF
    const srcs=[{y:obj.y-HALF},{y:obj.y+HALF}];
    const rays=srcs.map(s=>{
      const ryRaw=reflectYRaw(s.y,eye.x,eye.y);
      if(ryRaw===null) return null;
      // 범위 체크는 raw 값으로 (스냅 전에 판단해야 경고가 정확히 뜸)
      if(ryRaw<top||ryRaw>bot) return null;
      // 시각적 정렬은 HALF 단위 스냅
      const ry=Math.round(ryRaw/HALF)*HALF;
      return {srcY:s.y, ry};
    });
    const valid=rays.filter(r=>r!==null);

    if(valid.length===0){
      setMsg('show-err','❌ 반사된 빛이 눈에 도달하지 못합니다\n(거울 범위를 벗어남)');
      if(showImg2){
        ctx.save(); ctx.globalAlpha=0.32; drawCandle(img.x,img.y,true); ctx.restore();
        drawBgLabel(img.x,img.y-46,'거울 속 상','rgba(59,91,219,0.48)');
      }
      drawCandle(obj.x,obj.y,false);
      drawBgLabel(obj.x,obj.y-46,'물체','#2c2c2a','rgba(255,255,255,0.85)');
      drawEye(eye.x,eye.y,'눈(관찰자)');
      return;
    }
    setMsg(null);

    // 법선 & 각도 (위쪽 광선 기준)
    const ref=valid[0];
    const inDeg=Math.atan2(Math.abs(ref.ry-ref.srcY),Math.abs(mx-obj.x))*180/Math.PI;
    const inc=Math.round(90-inDeg);
    document.getElementById('angle-info').style.display='flex';
    document.getElementById('angle-val').textContent=inc+'°';

    if(showNormal){
      const ry0=ref.ry;
      ctx.save();
      ctx.strokeStyle='rgba(100,98,90,0.78)'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(mx-60,ry0); ctx.lineTo(mx+60,ry0); ctx.stroke();
      ctx.setLineDash([]);
      const inA =Math.atan2(ref.srcY-ry0,obj.x-mx);
      ctx.strokeStyle='#e63946'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(mx,ry0,24,Math.PI,Math.PI+Math.abs(inA),inA>0); ctx.stroke();
      const refA=Math.atan2(eye.y-ry0,eye.x-mx);
      ctx.strokeStyle='#2a9d8f'; ctx.lineWidth=1.8;
      ctx.beginPath(); ctx.arc(mx,ry0,30,0,Math.abs(refA),refA<0); ctx.stroke();
      ctx.font='bold 11px "Segoe UI",sans-serif'; ctx.textAlign='left';
      ctx.fillStyle='#e63946'; ctx.fillText('입사각 '+inc+'°',mx+6,ry0-7);
      ctx.fillStyle='#2a9d8f'; ctx.fillText('반사각 '+inc+'°',mx+6,ry0+21);
      ctx.restore();
    }

    // 연장선 (거울 속 상 각 출발점을 향해)
    if(showImg2){
      valid.forEach((ray,i)=>{
        const rp={x:mx,y:ray.ry};
        const tx=img.x, ty=ray.srcY;
        const dx=tx-rp.x, dy=ty-rp.y, len=Math.sqrt(dx*dx+dy*dy);
        const ex2=rp.x+dx/len*(len+20), ey2=rp.y+dy/len*(len+20);
        ctx.save();
        ctx.strokeStyle='#e9c46a'; ctx.lineWidth=1.8; ctx.setLineDash([8,6]);
        ctx.beginPath(); ctx.moveTo(rp.x,rp.y); ctx.lineTo(ex2,ey2); ctx.stroke();
        ctx.setLineDash([]); ctx.restore();
        if(i===0){
          ctx.save(); ctx.font='10px "Segoe UI",sans-serif';
          ctx.fillStyle='#b8860b'; ctx.textAlign='center';
          ctx.fillText('연장선',(rp.x+ex2)/2+18,(rp.y+ey2)/2-8);
          ctx.restore();
        }
      });
      valid.forEach(ray=>{
        ctx.save();
        ctx.fillStyle='rgba(233,196,106,0.9)'; ctx.strokeStyle='#c9a434'; ctx.lineWidth=1.8;
        ctx.beginPath(); ctx.arc(img.x,ray.srcY,7,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();
      });
    }

    // 쌍광선 (입사 + 반사)
    valid.forEach((ray,i)=>{
      const rp={x:mx,y:ray.ry};
      drawRay(obj.x,ray.srcY,rp.x,rp.y,'#e63946',false,2.0,true);
      drawRay(rp.x,rp.y,eye.x,eye.y,'#2a9d8f',false,2.0,true);
      if(i===0){
        ctx.save(); ctx.font='10px "Segoe UI",sans-serif';
        ctx.fillStyle='#e63946'; ctx.textAlign='center';
        ctx.fillText('입사광선',(obj.x+rp.x)/2-18,(ray.srcY+rp.y)/2-10);
        ctx.fillStyle='#2a9d8f';
        ctx.fillText('반사광선',(rp.x+eye.x)/2+18,(rp.y+eye.y)/2-10);
        ctx.restore();
      }
    });
  }

  if(showImg2){
    ctx.save(); ctx.globalAlpha=0.4; drawCandle(img.x,img.y,true); ctx.restore();
    drawBgLabel(img.x,img.y-46,'거울 속 상','rgba(59,91,219,0.55)');
  }
  drawCandle(obj.x,obj.y,false);
  drawBgLabel(obj.x,obj.y-46,'물체','#2c2c2a','rgba(255,255,255,0.85)');
  drawEye(eye.x,eye.y,'눈(관찰자)');
}

// ─── 메인 draw ────────────────────────────────────────────────────
function draw(){
  ctx.clearRect(0,0,W,H);
  if(mode===0) drawMode0();
  else drawMode1();
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===m));
  ['mode0-ctrl','mode1-ctrl'].forEach((id,i)=>{
    document.getElementById(id).style.display=i===m?'flex':'none';
  });
  setMsg(null);
  document.getElementById('img-dist-item').style.opacity='1';
  const hints=[
    '← 물체를 드래그해서 움직여 보세요',
    '← 물체와 눈을 드래그해 보세요'
  ];
  document.getElementById('hint').textContent=hints[m];
  draw();
}

// ─── 드래그 (탐구 1·2 전용) ──────────────────────────────────────
let dragging=null;

function getPos(e){
  const r=canvas.getBoundingClientRect();
  const sx=W/r.width, sy=H/r.height;
  const src=e.touches?e.touches[0]:e;
  return {x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
}
function distPt(ax,ay,bx,by){return Math.sqrt((ax-bx)**2+(ay-by)**2);}
function hit(p,tx,ty,r){return distPt(p.x,p.y,tx,ty)<r;}

function startDrag(e){
  if(mode>=2) return;
  const p=getPos(e); const R=45;
  if(mode===0){
    if(hit(p,obj.x,obj.y,R)) dragging='obj';
  } else {
    if(hit(p,obj.x,obj.y,R)) dragging='obj';
    else if(hit(p,eye.x,eye.y,R)) dragging='eye';
  }
  if(dragging) e.preventDefault();
}

function moveDrag(e){
  if(!dragging) return;
  e.preventDefault();
  const p=getPos(e);
  const PAD=HALF;
  function snapY(y){return Math.min(H-PAD,Math.max(PAD,Math.round(y/HALF)*HALF));}
  function snapX(rx,ry,top,bot){
    const sy=Math.round(ry/HALF)*HALF;
    const xLim=(sy>=top&&sy<=bot)?mx-GRID:mx;
    return Math.min(xLim,Math.max(PAD,Math.round(rx/GRID)*GRID));
  }
  const top=mode===0?m1Top():m2Top();
  const bot=mode===0?m1Bot():m2Bot();
  if(dragging==='obj'){obj.x=snapX(p.x,p.y,top,bot);obj.y=snapY(p.y);}
  else if(dragging==='eye'){eye.x=snapX(p.x,p.y,top,bot);eye.y=snapY(p.y);}
  draw();
}

function endDrag(){dragging=null;}

canvas.addEventListener('mousedown', startDrag);
canvas.addEventListener('mousemove', moveDrag);
canvas.addEventListener('mouseup',   endDrag);
canvas.addEventListener('mouseleave',endDrag);
canvas.addEventListener('touchstart',startDrag,{passive:false});
canvas.addEventListener('touchmove', moveDrag, {passive:false});
canvas.addEventListener('touchend',  endDrag);
window.addEventListener('resize',    resize);

resize();
</script>
